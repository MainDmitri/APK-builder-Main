name: appbuilder_engine
description: AppBuilder Engine — build worker that turns ZIP projects (web, Node.js, native Android) into signed APKs.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  appbuilder_core:
    path: ../packages/appbuilder_core
  archive: ^4.3.0
  args: ^2.7.0
  crypto: ^3.0.7
  http_parser: ^4.1.2
  image: ^4.10.1
  mime: ^2.1.0
  path: ^1.9.1
  shelf: ^1.4.2

dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.32.0
