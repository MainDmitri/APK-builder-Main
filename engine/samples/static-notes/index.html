<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565C0">
  <title>Заметки</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="bar">
    <h1>Заметки</h1>
    <button id="export" class="icon-btn" title="Экспорт в JSON" aria-label="Экспорт">⇩</button>
  </header>
  <main>
    <input id="search" class="search" type="search" placeholder="Поиск по заметкам" autocomplete="off">
    <p id="empty" class="empty" hidden>Заметок пока нет. Нажмите «+», чтобы добавить.</p>
    <ul id="list" class="list"></ul>
  </main>
  <button id="add" class="fab" aria-label="Новая заметка">+</button>

  <dialog id="editor" class="editor">
    <form method="dialog" id="editor-form">
      <input id="title" name="title" placeholder="Заголовок" maxlength="120" required>
      <textarea id="body" name="body" placeholder="Текст заметки" rows="8"></textarea>
      <div class="actions">
        <button type="button" id="delete" class="danger">Удалить</button>
        <span class="spacer"></span>
        <button type="button" id="cancel">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
