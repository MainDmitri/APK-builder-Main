name: flutter_netinfo
description: Сеть и Wi-Fi на Flutter — пример AppBuilder (проверка плагинов iOS и Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.2
  network_info_plus: ^8.2.2
  share_plus: ^13.3.1
  mobile_scanner: ^7.4.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
