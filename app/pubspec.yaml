name: appbuilder
description: "AppBuilder: сборка APK из ZIP, генератор промптов и контракт для ИИ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  appbuilder_core:
    path: ../packages/appbuilder_core
  archive: ^4.3.0
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
